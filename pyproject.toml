[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmacy-ocr-service"
version = "3.3.0"
description = "Production service that extracts medicine line items from Tunisian pharmacy invoices."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mohamed Amin Neji" }]
keywords = ["ocr", "invoice", "pharmacy", "paddleocr", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Runtime dependencies are pinned in requirements.txt, which is the source of
# truth for deployments. The ranges here exist so the package stays installable
# as a library inside a larger application.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "numpy>=1.26",
    "opencv-contrib-python>=4.10",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
ocr = ["paddlepaddle>=3.0", "paddleocr>=3.4"]
llm = ["ollama>=0.4"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.11",
]

[project.scripts]
pharmacy-ocr = "pharmacy_ocr.cli.main:main"

[project.urls]
Documentation = "https://github.com/AminNeji/pharmacy-ocr-service#readme"
Source = "https://github.com/AminNeji/pharmacy-ocr-service"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pharmacy_ocr = ["py.typed"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# "." lets tests import shared helpers as `tests.conftest`.
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: tests that load real OCR models or call external services",
]
filterwarnings = ["error::DeprecationWarning:pharmacy_ocr.*"]

[tool.coverage.run]
source = ["src/pharmacy_ocr"]
branch = true
omit = ["*/cli/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "I",                 # isort
    "N",                 # pep8-naming
    "UP",                # pyupgrade
    "B",                 # bugbear
    "C4",                # comprehensions
    "SIM",               # simplify
    "RET",               # return
    "PTH",               # use pathlib
    "RUF",               # ruff-specific
    "ASYNC",             # async correctness
    "S",                 # bandit security
    "BLE",               # blind except â€” each one must be justified with noqa
]
ignore = [
    "S101",   # assert is fine in tests
    "B008",   # FastAPI Depends()/File() in defaults is the documented idiom
    "RUF012", # mutable class attrs without ClassVar: noisy with pydantic
    "UP038",  # isinstance(x, (a, b)) is faster than the `a | b` form at runtime
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N802"]
# The few-shot prompt must stay byte-for-byte as it was tuned; rewrapping the
# example rows would change what the model sees.
"src/pharmacy_ocr/parsing/llm.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pharmacy_ocr", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/pharmacy_ocr"]
strict = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["cv2.*", "fitz.*", "paddleocr.*", "ollama.*", "numpy.*"]
ignore_missing_imports = true
