name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # The test suite injects a fake OCR engine, so PaddlePaddle (several hundred
  # megabytes) is deliberately not installed here. `pip install .[dev]` pulls
  # the core dependencies only; paddle lives in the optional `ocr` extra.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint, types, tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan pinned requirements for known vulnerabilities
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --requirement requirements.txt --strict || \
            echo "::warning::pip-audit reported findings; review before release"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: pharmacy-ocr-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm -d --name ocr-ci \
            -e ENVIRONMENT=development -e WARMUP_ON_STARTUP=false -e LOG_FORMAT=text \
            -p 8000:8000 pharmacy-ocr-service:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/live; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health/live
          docker logs ocr-ci
          docker stop ocr-ci
